# Minimal Supabase CLI config for Celerity Commerce backend pipeline.
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "celerity-commerce"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true

[functions.checkout]
verify_jwt = true

[functions.adjust-inventory]
verify_jwt = true

[functions.find-alternatives]
verify_jwt = false

[functions.process-outbox]
verify_jwt = true
